<!DOCTYPE html>
<!-- SNSシェア用画像(assets/og-image.jpg, 1200x630)の元デザイン。
     作り直すときは、このファイルを 1200x630 のブラウザ画面で開いてスクリーンショットを撮り、JPEG で保存する。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:"Noto Sans JP",sans-serif;color:#1e3322;position:relative;
  background:
    radial-gradient(520px 360px at 92% 8%, rgba(198,234,150,.85), transparent 65%),
    radial-gradient(420px 300px at 70% 95%, rgba(170,220,120,.55), transparent 65%),
    radial-gradient(600px 420px at -5% 105%, rgba(210,240,170,.9), transparent 60%),
    linear-gradient(160deg,#f7fcef 0%,#e4f4d0 55%,#d5edbb 100%)}
.leaf{position:absolute;top:-70px;left:-50px;width:240px;opacity:.95;filter:drop-shadow(0 10px 18px rgba(30,70,20,.18))}
.branch{position:absolute;right:-60px;bottom:-70px;width:420px;opacity:.9;transform:rotate(-8deg);filter:drop-shadow(0 10px 18px rgba(30,70,20,.18))}
.text{position:absolute;left:84px;top:118px;width:640px}
.role{display:inline-block;border:2px solid #3c9a3f;color:#3c9a3f;border-radius:999px;padding:6px 18px;font-size:17px;letter-spacing:.08em;font-weight:500;background:rgba(255,255,255,.6)}
h1{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:118px;line-height:1.15;margin-top:22px;letter-spacing:.04em}
.kana{font-size:22px;letter-spacing:.24em;color:#5b7360;margin-top:4px}
.copy{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:31px;color:#3c9a3f;margin-top:30px;line-height:1.5}
.sub{font-size:19px;color:#5b7360;margin-top:12px;line-height:1.6}
.url{position:absolute;left:84px;bottom:42px;font-size:18px;font-weight:700;letter-spacing:.06em;color:#3c9a3f;display:flex;align-items:center;gap:10px}
.url svg{width:24px;height:24px}
.photo{position:absolute;right:96px;top:84px;width:330px;height:420px;border-radius:26px;overflow:hidden;border:8px solid #fff;box-shadow:0 24px 50px rgba(30,70,20,.25);transform:rotate(3deg);background:#ddd}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
</style>
</head>
<body>
<img class="leaf" src="../assets/nature/leaves-hanging.webp" alt="">
<img class="branch" src="../assets/nature/branch-long.webp" alt="">
<div class="text">
  <span class="role">MEDICAL STUDENT / RESEARCHER / COMMUNITY</span>
  <h1>森 一真</h1>
  <p class="kana">MORI KAZUMA — もり かずま</p>
  <p class="copy">「おはよう」でつながる地域を、<br>医療とデータと共感で。</p>
  <p class="sub">佐賀大学医学部医学科 / 押しボタンプロジェクト 研究員<br>SCS(佐賀大学学生地域交流の会) 代表</p>
</div>
<div class="photo"><img src="../assets/profile-photo.webp" alt=""></div>
<p class="url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>kazuma160504-art.github.io</p>
</body>
</html>
